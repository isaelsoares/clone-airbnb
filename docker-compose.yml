# Sobe o site em http://localhost:8080 e o MariaDB já com o banco criado.
# Uso: docker compose up -d   |   apagar o banco: docker compose down -v
services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: clone_airbnb
      DB_USER: root
      DB_PASS: root
    depends_on:
      - db
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - dados:/var/lib/mysql
volumes:
  dados:
